name: Manual checks Android + iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Preflight
        run: python Deployment/Tools/preflight.py

  android-debug:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Debug APK
        run: gradle -p Android --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk

  ios-simulator:
    needs: preflight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Xcode-Version
        run: xcodebuild -version
      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project iOS/HauckisAppSammlung.xcodeproj \
            -scheme HauckisAppSammlung \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Pack Simulator App
        run: |
          cd "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent HauckisAppSammlung.app "$RUNNER_TEMP/HauckisAppSammlung-simulator.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/HauckisAppSammlung-simulator.zip
